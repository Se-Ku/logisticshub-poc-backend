lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'

    token_extractors:
        authorization_header:
            enabled: true
            prefix: Bearer
            name: Authorization
        cookie:
            enabled: true
            name: BEARER # Must match the cookie name in set_cookies

    # Enable automatic HttpOnly cookie handling
    set_cookies:
        BEARER:
            samesite: strict
            # TODO: set to true in production with HTTPS
            secure: false
            httpOnly: true
